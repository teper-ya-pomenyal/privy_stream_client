server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # CSP и прочие заголовки — генерируются при старте под адрес узла.
    # В location ниже нет своих add_header, поэтому эти наследуются везде.
    include /etc/nginx/privy/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Конфиг и точка входа не кэшируются: смена узла или выкладка видны сразу.
    location = /config.json { expires -1; }
    location = /index.html { expires -1; }

    # Файлы сборки с хэшем в имени — кэш на год.
    location /assets/ {
        expires 1y;
        access_log off;
    }

    # Роутер на #-адресах, но на всякий случай любые пути отдают приложение.
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
